name: Build & Publish VIE-Phim Cloud Image

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud_image/**"
      - ".github/workflows/build-cloud-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Lowercase Image Metadata
        shell: bash
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_NAME=ghcr.io/${OWNER_REPO}" >> "$GITHUB_ENV"
          echo "SHA_SHORT=${SHA_SHORT}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Prebaked Cloud Image
        uses: docker/build-push-action@v6
        with:
          context: ./cloud_image
          file: ./cloud_image/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
